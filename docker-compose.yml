version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: unichat_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-unichat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${DB_NAME:-unichat_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unichat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unichat_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: unichat_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unichat_network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unichat_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-unichat}:${DB_PASSWORD:-secure_password_123}@postgres:5432/${DB_NAME:-unichat_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your_refresh_secret_change_in_production}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-604800}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - backend_uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    networks:
      - unichat_network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unichat_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    networks:
      - unichat_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, uncomment for production-like setup)
  # nginx:
  #   image: nginx:alpine
  #   container_name: unichat_nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - unichat_network
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_node_modules:
  frontend_node_modules:

networks:
  unichat_network:
    driver: bridge
